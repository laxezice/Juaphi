<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0a12">
  <title>จั่วผี</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;600&family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
  <!-- __V__ คือเลขรุ่นที่เซิร์ฟเวอร์ใส่ให้ตอนส่งหน้านี้ deploy ใหม่ = URL ใหม่ เบราว์เซอร์จะไม่ใช้โค้ดเก่าที่เก็บไว้ -->
  <meta name="juaphi-version" content="__V__">
  <link rel="stylesheet" href="style.css?v=__V__">
  <style>:root { --btn-draw: url("/buttons/draw.webp?v=__V__"); --btn-nope: url("/buttons/nope.webp?v=__V__"); }</style>
  <script type="importmap">{ "imports": {
    "three": "/vendor/three.module.js",
    "/ui.js": "/ui.js?v=__V__",
    "/net.js": "/net.js?v=__V__",
    "/cards.js": "/cards.js?v=__V__",
    "/scene.js": "/scene.js?v=__V__",
    "/tray.js": "/tray.js?v=__V__",
    "/sound.js": "/sound.js?v=__V__",
    "/reveal.js": "/reveal.js?v=__V__",
    "/board2d.js": "/board2d.js?v=__V__"
  } }</script>
</head>
<body>
  <canvas id="scene" aria-hidden="true"></canvas>
  <!-- กระดานแบบ 2D (board2d.js) ใช้แทน canvas เมื่อเลือกโหมด 2D -->
  <div id="board2d" hidden></div>

  <!-- หน้าแรก -->
  <main id="home" class="screen" hidden>
    <h1 class="logo">จั่วผี</h1>
    <p class="tag">จั่วการ์ดไปเรื่อยๆ ใครจั่วได้ <b>ผี</b> แล้วไม่มี <b>ยันต์</b> ตกรอบ คนสุดท้ายที่รอดชนะ</p>
    <label class="field">ชื่อของคุณ
      <input id="name" maxlength="20" autocomplete="nickname" placeholder="เช่น ต้น">
    </label>
    <button id="create" class="btn primary">สร้างห้องใหม่</button>
    <section class="rooms">
      <h2>ห้องที่เปิดอยู่</h2>
      <ul id="room-list"></ul>
      <p id="no-rooms" class="muted">ยังไม่มีห้องเปิดอยู่ สร้างห้องแล้วชวนเพื่อนได้เลย</p>
    </section>
  </main>

  <!-- ห้องรอ -->
  <main id="lobby" class="screen" hidden>
    <header class="bar">
      <div><div id="lobby-name" class="title"></div><div class="muted">รหัสห้อง <b id="lobby-code"></b></div></div>
      <button id="lobby-leave" class="btn ghost small">ออกจากห้อง</button>
    </header>
    <button id="invite" class="btn">คัดลอกลิงก์เชิญ</button>
    <ul id="lobby-players" class="players"></ul>
    <button id="add-bot" class="btn" hidden>เพิ่มบอต</button>
    <p id="lobby-hint" class="muted"></p>
    <button id="start" class="btn primary" hidden>เริ่มเกม</button>
  </main>

  <!-- ในเกม -->
  <section id="game" class="screen" hidden>
    <header class="hud">
      <div id="turn" class="turn"></div>
      <div class="hud-btns">
        <button id="mute-btn" class="btn ghost small icon-btn" aria-label="ปิดเสียง" title="ปิดเสียง"></button>
        <button id="cards-btn" class="btn ghost small">การ์ด</button>
        <button id="combo-btn" class="btn ghost small">คอมโบ</button>
        <button id="menu-btn" class="btn ghost small" aria-haspopup="true">เมนู</button>
      </div>
    </header>
    <!-- กล่องปรับเสียง: เปิดจากปุ่มลำโพง -->
    <div id="vol-pop" class="vol-pop" hidden>
      <button id="vol-mute" class="btn ghost small icon-btn" aria-label="ปิดเสียง"></button>
      <input id="vol-range" type="range" min="0" max="100" step="1" aria-label="ความดัง">
      <span id="vol-num" class="vol-num"></span>
    </div>
    <div id="menu" class="menu" hidden>
      <div id="menu-players"></div>
      <button id="board-toggle" class="btn ghost small"></button>
      <button id="game-leave" class="btn ghost small">ออกจากห้อง</button>
    </div>
    <div id="log" class="log" aria-live="polite"></div>
    <!-- ลำดับการโต้ตอบระหว่างช่วงกด "ไม่!": ใบที่เล่น แล้วตามด้วย ไม่! ทีละใบ -->
    <div id="chain" class="chain" hidden>
      <div id="chain-cards" class="chain-cards"></div>
      <div id="chain-status" class="chain-status"></div>
    </div>
    <div id="hand" class="hand" hidden></div>
    <footer class="actions">
      <div id="prompt" class="prompt"></div>
      <div id="window-bar" class="window-bar" hidden><span></span></div>
      <div class="row">
        <button id="nope" class="btn nope" hidden>
          <svg class="nope-ring" viewBox="0 0 100 100" aria-hidden="true">
            <circle class="ring-track" cx="50" cy="50" r="46"></circle>
            <circle id="nope-ring" class="ring-time" cx="50" cy="50" r="46"></circle>
          </svg>
          <span>ไม่!</span>
        </button>
        <button id="play" class="btn primary" hidden></button>
        <button id="draw" class="btn draw" hidden>จั่ว</button>
        <button id="grudge" class="btn ghostly" hidden>อาฆาต</button>
      </div>
    </footer>
    <div id="winner" class="winner" hidden>
      <div class="winner-box">
        <div id="winner-text"></div>
        <button id="again" class="btn primary" hidden>เล่นอีกรอบ</button>
        <p id="again-hint" class="muted"></p>
      </div>
    </div>
  </section>

  <!-- กล่องเลือก -->
  <div id="modal" class="modal" hidden>
    <div class="modal-box" role="dialog" aria-modal="true">
      <div id="modal-title" class="title"></div>
      <div id="modal-body"></div>
      <button id="modal-cancel" class="btn ghost small">ยกเลิก</button>
    </div>
  </div>

  <!-- แถวเลือกการ์ดแบบเห็นภาพ (tray.js) -->
  <div id="tray-layer" class="tray-layer" hidden>
    <div class="info-banner">
      <span id="tray-tag" class="info-tag">เลือกการ์ด</span>
      <div id="tray-title" class="info-text"></div>
      <div id="tray-detail" class="info-detail"></div>
    </div>
    <div id="tray-cards" class="tray"></div>
    <div class="tray-bar">
      <button id="tray-cancel" class="btn ghost small">ยกเลิก</button>
      <button id="tray-ok" class="btn primary small">ยืนยัน</button>
    </div>
  </div>

  <!-- แผงเต็มจอ: รายการการ์ด / คอมโบ -->
  <div id="panel" class="panel" hidden>
    <header class="panel-head">
      <div id="panel-title" class="title"></div>
      <button id="panel-close" class="btn ghost small">ปิด</button>
    </header>
    <div id="panel-body"></div>
  </div>

  <!-- ฉากเปิดการ์ดผี (reveal.js) -->
  <div id="reveal" class="reveal" hidden aria-live="assertive">
    <div class="reveal-flash"></div>
    <!-- ใครจั่ว: ขึ้นเหนือการ์ดตั้งแต่ต้น -->
    <div class="reveal-who"><b id="reveal-name"></b><span>จั่วได้ผี!</span></div>
    <div id="reveal-card" class="reveal-card">
      <div class="reveal-inner">
        <img id="reveal-back" class="reveal-side reveal-back" alt="">
        <img id="reveal-face" class="reveal-side reveal-face" alt="ผี">
      </div>
    </div>
    <!-- แสงศักดิ์สิทธิ์ตอนยันต์ปัดเป่า: รัศมีหมุน วงแสง และประกาย -->
    <div class="reveal-holy" aria-hidden="true">
      <div class="holy-rays"></div>
      <div class="holy-glow"></div>
      <div class="holy-ring"></div>
      <div class="holy-sparks"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
    </div>
    <div id="reveal-talisman" class="reveal-talisman"><img alt="ยันต์"></div>
    <div class="reveal-caption">
      <div id="reveal-text" class="reveal-text"></div>
      <div id="reveal-sub" class="reveal-sub"></div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>
  <div id="conn" class="conn" hidden>กำลังเชื่อมต่อใหม่…</div>

  <script type="module" src="main.js?v=__V__"></script>
</body>
</html>
